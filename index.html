<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multi-Agent AI System — Architecture</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-dark.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0d1117; }
    .markdown-body {
      box-sizing: border-box;
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }
    .mermaid { background: #0d1117; padding: 16px; border-radius: 8px; overflow-x: auto; }
    pre code.hljs { border-radius: 8px; }
    #status { position: fixed; top: 8px; right: 12px; font: 12px ui-monospace,monospace; color: #8b949e; }
  </style>
</head>
<body>
  <div id="status">loading…</div>
  <article id="content" class="markdown-body"></article>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "strict" });

    const status = document.getElementById("status");
    const content = document.getElementById("content");

    const renderer = new marked.Renderer();
    const baseCode = renderer.code.bind(renderer);
    renderer.code = (code, lang) => {
      if (lang === "mermaid") return `<div class="mermaid">${code}</div>`;
      return baseCode(code, lang);
    };
    marked.setOptions({
      renderer,
      gfm: true,
      breaks: false,
      highlight: (code, lang) => {
        try {
          return lang && hljs.getLanguage(lang)
            ? hljs.highlight(code, { language: lang }).value
            : hljs.highlightAuto(code).value;
        } catch { return code; }
      },
    });

    try {
      const res = await fetch("ARCHITECTURE.md", { cache: "no-cache" });
      if (!res.ok) throw new Error(`fetch ARCHITECTURE.md: ${res.status}`);
      const md = await res.text();
      content.innerHTML = marked.parse(md);
      await mermaid.run({ querySelector: ".mermaid" });
      status.textContent = "ok";
      setTimeout(() => (status.style.display = "none"), 1200);
    } catch (e) {
      status.textContent = "error";
      content.innerHTML = `<pre style="color:#ff7b72">${String(e)}</pre>`;
    }
  </script>
</body>
</html>
